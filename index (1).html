<!doctype html>
<html lang="pt">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vigia</title>
<style>
body{margin:0;font:16px sans-serif;background:#111;color:#eee;padding:12px}
button,a{background:#2a2a2a;color:#eee;border:0;padding:10px 14px;border-radius:8px;text-decoration:none;font:inherit}
#go{width:100%;background:#c62828;font-weight:700;padding:16px}
video{width:100%;border-radius:8px;margin:8px 0}
.r{background:#1c1c1c;padding:8px;border-radius:8px;margin:8px 0}
.r div{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.r span{flex:1}
#s{margin:8px 0;opacity:.8}
</style>
<button id="go">INICIAR VIGILÂNCIA</button>
<div id="s">Parado</div>
<video id="v" muted playsinline hidden></video>
<label>Sensibilidade <input id="sens" type="range" min="1" max="20" value="3"></label>
<h3>Gravações</h3>
<div id="l"></div>
<script>
const $=s=>document.querySelector(s);
const db=new Promise(r=>{const q=indexedDB.open('v',1);q.onupgradeneeded=()=>q.result.createObjectStore('g',{keyPath:'t'});q.onsuccess=()=>r(q.result)});
const tx=async(m,f)=>{const d=await db;return new Promise(r=>{const t=d.transaction('g',m);const o=f(t.objectStore('g'));t.oncomplete=()=>r(o&&o.result)})};
const MAX=60;
async function render(){
  const all=(await tx('readonly',s=>s.getAll())).sort((a,b)=>b.t-a.t);
  for(const x of all.slice(MAX))await tx('readwrite',s=>s.delete(x.t));
  $('#l').innerHTML='';
  for(const x of all.slice(0,MAX)){
    const u=URL.createObjectURL(x.b),d=document.createElement('div');
    d.className='r';
    d.innerHTML=`<div><span>${new Date(x.t).toLocaleString('pt-PT')}</span><a href="${u}" download="vigia-${x.t}.webm">Guardar</a><button>Apagar</button></div><video src="${u}" controls preload="none" style="width:100%"></video>`;
    d.querySelector('button').onclick=async()=>{await tx('readwrite',s=>s.delete(x.t));render()};
    $('#l').append(d);
  }
}
render();
$('#go').onclick=async()=>{
  $('#go').hidden=true;
  const v=$('#v');
  v.srcObject=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:640}});
  await v.play();
  try{await navigator.wakeLock.request('screen')}catch{}
  const W=640,H=Math.round(640*v.videoHeight/v.videoWidth)||480;
  const big=Object.assign(document.createElement('canvas'),{width:W,height:H}),bc=big.getContext('2d');
  const sm=Object.assign(document.createElement('canvas'),{width:32,height:24}),sc=sm.getContext('2d',{willReadFrequently:true});
  let prev,rec,chunks,last=0,start=0;
  const arm=Date.now()+30000;
  const stop=()=>rec&&rec.state!='inactive'&&rec.stop();
  const begin=()=>{
    chunks=[];start=Date.now();
    rec=new MediaRecorder(big.captureStream(10));
    rec.ondataavailable=e=>chunks.push(e.data);
    rec.onstop=async()=>{await tx('readwrite',s=>s.put({t:start,b:new Blob(chunks,{type:'video/webm'})}));render()};
    rec.start(1000);
  };
  setInterval(()=>{
    const now=Date.now();
    bc.drawImage(v,0,0,W,H);
    bc.fillStyle='#000a';bc.fillRect(0,0,W,24);
    bc.fillStyle='#fff';bc.font='16px sans-serif';bc.fillText(new Date(now).toLocaleString('pt-PT'),6,18);
    sc.drawImage(v,0,0,32,24);
    const d=sc.getImageData(0,0,32,24).data;
    let n=0;
    if(prev)for(let i=0;i<d.length;i+=4)if(Math.abs(d[i]+d[i+1]+d[i+2]-prev[i]-prev[i+1]-prev[i+2])>90)n++;
    prev=d;
    const left=Math.ceil((arm-now)/1000);
    if(left>0){$('#s').textContent='Sai do quarto: '+left+'s';return}
    const moved=n/768*100>$('#sens').valueAsNumber;
    if(moved){last=now;if(!rec||rec.state=='inactive')begin()}
    if(rec&&rec.state=='recording'&&(now-last>8000||now-start>120000))stop();
    $('#s').textContent=rec&&rec.state=='recording'?'● A GRAVAR':'A vigiar...';
  },100);
};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
